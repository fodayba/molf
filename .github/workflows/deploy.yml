# CI/CD for the Make Our Leaders Foundation site.
#
#   Pull request  -> lint + build -> deploy a temporary preview channel, link posted on the PR
#   Push to main  -> lint + build -> deploy to the live site (https://molf-site.web.app)
#
# Auth is keyless: GitHub's OIDC token is exchanged via Workload Identity Federation for a
# short-lived token of the deploy service account. No Google credentials are stored in GitHub.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   FIREBASE_PROJECT_ID   molf-site
#   WIF_PROVIDER          projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   WIF_SERVICE_ACCOUNT   github-deployer@molf-site.iam.gserviceaccount.com
#   VITE_FORMSPREE_ID     (optional) Formspree form ID for the contact form

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Superseded PR builds are cancelled; a live deploy is never interrupted part-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  FIREBASE_TOOLS: firebase-tools@15

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  preview:
    name: Deploy preview
    # Forks get no OIDC token for this repo, so previews run only for branches in this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to preview channel
        id: deploy
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --expires 7d --non-interactive --json > deploy.json
          url=$(jq -r '.result[].url' deploy.json | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on the PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- firebase-preview -->'
            const body = `${marker}\n**Preview ready:** ${process.env.PREVIEW_URL}\n\nBuilt from ${context.sha.slice(0, 7)}. Expires in 7 days.`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://molf-site.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive \
            --message "${{ github.sha }}"
